name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Run pytest
        run: python -m pytest

  publish-local-release:
    name: Publish local release executable
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify locally built executable is present
        run: |
          exe="dist/SerialHub-${GITHUB_REF_NAME}.exe"
          if [ ! -f "$exe" ]; then
            echo "No local release executable found at $exe. Build locally with scripts/build_release.ps1 and commit it before tagging."
            exit 1
          fi
          printf '%s\n' "$exe"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SerialHub-${{ github.ref_name }}.exe
          generate_release_notes: true
